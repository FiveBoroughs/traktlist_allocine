services:
  traktlist:
    # Built and pushed by .github/workflows/docker.yml on every push to main.
    # `docker compose pull` fetches it; `build` is only for local changes.
    image: ghcr.io/fiveboroughs/traktlist_allocine:latest
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      # Schedule in the NAS timezone. The container stays running between runs.
      TZ: Europe/Paris
      SYNC_TIME: "00:00"
      PYTHONUNBUFFERED: "1"
    volumes:
      - ./.pytrakt.json:/app/.pytrakt.json
      # Published JSON lists - point your web server at this directory.
      - ./lists:/app/lists
    restart: unless-stopped
    stop_grace_period: 1m
